<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex,nofollow">
<title>Hells Kitchen</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://thespectrumtechengine.com/ste-owner.js" data-app="hells-kitchen" defer></script>
<style>
  :root { --sky:#14213d; --sun:#f5a623; --text:#ffffff; --soft:#b9c3d9; --card:#1e2d52; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--sky); color:var(--text);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:24px 16px; }
  #icon { width:min(72vw, 52vh, 340px); aspect-ratio:1; padding:0; border:0;
    background:none; cursor:pointer; border-radius:22%; -webkit-tap-highlight-color:transparent; }
  #icon img { width:100%; height:100%; border-radius:22%; box-shadow:0 14px 50px rgba(0,0,0,.5); display:block; }
  h1 { margin:0; font-size:clamp(1.8rem, 8vw, 2.6rem); font-weight:800; letter-spacing:.02em; text-align:center; }
  #icon:active { transform:scale(.94); }
  #ask { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); padding:16px; }
  #ask.on { display:flex; }
  .box { background:var(--card); border-radius:18px; padding:24px 20px 18px; width:100%; max-width:320px; text-align:center; }
  .box p { margin:0 0 20px; font-size:1.1rem; line-height:1.4; }
  .row { display:flex; gap:12px; }
  .row button, .row a { flex:1; padding:14px; border-radius:12px; border:0; font:inherit; font-size:1rem;
    font-weight:700; text-decoration:none; cursor:pointer; text-align:center; }
  .no { background:transparent; color:var(--soft); border:2px solid var(--soft) !important; }
  .yes { background:var(--sun); color:#1a1300; }
</style>
</head>
<body>
<main>
  <button id="icon" aria-label="Hell's Kitchen"><img src="icon-512.png" alt=""></button>
  <h1>Hell's Kitchen</h1>
</main>
<div id="ask" role="dialog" aria-modal="true" aria-label="Download">
  <div class="box">
    <p>Would you like to download the Hells Kitchen app?</p>
    <div class="row">
      <button class="no" id="no">No</button>
      <a class="yes" id="yes" href="https://github.com/SpectrumTechEngine/hells-kitchen/releases/latest/download/hells-kitchen.apk">Yes</a>
    </div>
  </div>
</div>
<script>
  const ask = document.getElementById('ask');
  document.getElementById('icon').onclick = () => ask.classList.add('on');
  document.getElementById('no').onclick = () => ask.classList.remove('on');
  ask.onclick = e => { if (e.target === ask) ask.classList.remove('on'); };
  document.getElementById('yes').onclick = () => {
    try { STE.track && STE.track('download'); } catch (e) {}
    setTimeout(() => ask.classList.remove('on'), 300);
  };
</script>
</body>
</html>
